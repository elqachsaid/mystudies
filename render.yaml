services:
  - type: web
    name: mystudies
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    healthCheckPath: /api/stats
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: mystudies-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1
